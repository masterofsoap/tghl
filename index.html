<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Game Hockey League</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:
        Inter,
        SF Pro Display,
        Helvetica,
        Arial,
        sans-serif;
}

body{
    background:#050505;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Background */

body::before{
    content:"";
    position:absolute;
    inset:-30%;
    background:

    radial-gradient(circle at 50% 20%,
    rgba(110,60,200,.35),
    transparent 45%),

    radial-gradient(circle at 80% 90%,
    rgba(212,175,55,.08),
    transparent 40%),

    radial-gradient(circle at 10% 80%,
    rgba(80,40,150,.12),
    transparent 35%);

    filter:blur(90px);

    animation:moveGlow 18s ease-in-out infinite alternate;
}

body::after{
    content:"";
    position:absolute;
    inset:0;
    background:

    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);

    background-size:120px 120px;

    opacity:.15;
}

@keyframes moveGlow{

0%{
transform:translate(-4%,-2%) scale(1);
}

100%{
transform:translate(5%,3%) scale(1.08);
}

}

/* Main */

.hero{

    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    width:100%;
    padding:40px;

}

/* Logo */

.logo{

    width:min(220px,35vw);
    margin-bottom:60px;

    filter:
    drop-shadow(0 0 40px rgba(212,175,55,.18))
    drop-shadow(0 0 120px rgba(120,70,255,.15));

}

/* Title */

h1{

    font-size:clamp(4rem,9vw,8rem);

    font-weight:900;

    letter-spacing:-5px;

    line-height:.9;

    text-transform:uppercase;

}

.league{

    margin-top:18px;

    color:#b9b9c7;

    font-size:clamp(.9rem,1.6vw,1.3rem);

    letter-spacing:.85rem;

    text-transform:uppercase;

}

/* Divider */

.divider{

    width:90px;

    height:2px;

    margin:70px 0;

    background:#d4af37;

}

/* Tagline */

.tagline{

    font-size:clamp(1.1rem,2vw,1.8rem);

    color:#d7d7df;

    font-weight:300;

    letter-spacing:.04em;

}

/* Coming Soon */

.coming{

    margin-top:60px;

    color:#d4af37;

    letter-spacing:1rem;

    text-transform:uppercase;

    font-size:.95rem;

    font-weight:700;

}

/* Bottom */

.bottom{

    position:absolute;

    bottom:35px;

    width:100%;

    text-align:center;

    color:#666;

    letter-spacing:.35rem;

    font-size:.75rem;

    text-transform:uppercase;

}

@media(max-width:700px){

.logo{
width:150px;
margin-bottom:45px;
}

.divider{
margin:45px 0;
}

.coming{

letter-spacing:.55rem;

font-size:.8rem;

}

.bottom{

font-size:.65rem;

letter-spacing:.2rem;

bottom:20px;

}

}
</style>

</head>

<body>

<div class="hero">

<img src="tghl.png" class="logo" alt="TGHL Logo">

<h1>THE GAME</h1>

<div class="league">
HOCKEY LEAGUE
</div>

<div class="divider"></div>

<div class="tagline">
Revolutionizing Adult Hockey
</div>

<div class="coming">
COMING&nbsp;&nbsp;SOON
</div>

</div>

<div class="bottom">
THE GAME HOCKEY LEAGUE
</div>

</body>
</html>
